<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cfc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="6" y="6" width="168" height="168" rx="36" ry="36" fill="url(#bgGrad)"/>
  <!-- Outer hex ring -->
  <polygon points="90,28 132,54 132,108 90,134 48,108 48,54" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linejoin="round"/>
  <!-- Inner hex ring -->
  <polygon points="90,42 120,62 120,100 90,120 60,100 60,62" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Center M -->
  <text x="90" y="112" text-anchor="middle" fill="white" font-family="'Inter','Segoe UI',sans-serif" font-size="52" font-weight="800" letter-spacing="-2">M</text>
  <!-- Tech slash -->
  <line x1="108" y1="88" x2="118" y2="78" stroke="rgba(255,255,255,0.5)" stroke-width="4" stroke-linecap="round"/>
  <!-- Corner brackets -->
  <path d="M14 28V14h14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round"/>
  <path d="M166 28V14h-14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round"/>
  <path d="M14 152v14h14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round"/>
  <path d="M166 152v14h-14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round"/>
</svg>
